name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công từ giao diện web

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # Cần quyền để tự tạo GitHub Release khi có tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Cài tauri-cli bằng prebuilt binary (nhanh gấp 10-20 lần so với cargo install)
      - name: Install Tauri CLI
        shell: bash
        run: |
          cargo install cargo-binstall
          cargo binstall tauri-cli --no-confirm

      - name: Build Tauri App
        run: cargo tauri build

      # Lưu Artifacts kiểm tra nội bộ (tồn tại 14 ngày)
      - name: Upload Standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vate-Standalone-EXE
          path: src-tauri/target/release/vate.exe
          retention-days: 14

      - name: Upload Setup Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Vate-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

      # Tự động xuất bản GitHub Release khi bạn push tag dạng v*.*.*
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            src-tauri/target/release/vate.exe
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}