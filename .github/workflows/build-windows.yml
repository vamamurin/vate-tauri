name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only changes do not need a 10-minute Windows build.
    # (Path filters are ignored for tag pushes, so release tags always build.)
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch: # Run manually from the Actions tab

# A newer push to the same branch/tag cancels the older, still-running build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the release job below gets write access
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Stops a release whose tag does not match the app version
      # (v1.0.0 shipped as 0.1.0 because of this)
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "tag=$tag tauri.conf.json=$conf Cargo.toml=$cargo"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag v$tag does not match tauri.conf.json ($conf) / Cargo.toml ($cargo)"
            exit 1
          fi

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Downloads a prebuilt tauri-cli binary (seconds instead of minutes)
      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Build Tauri App
        run: cargo tauri build

      # if-no-files-found: error makes the run fail if a file is missing
      # (v1.1.0 shipped without vate.exe because this was silent)
      - name: Upload Standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vate-Standalone-EXE
          path: src-tauri/target/release/vate.exe
          retention-days: 14
          if-no-files-found: error

      - name: Upload Setup Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Vate-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create the release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Creates a DRAFT release with both .exe files attached.
      # You then write the notes and click "Publish" on GitHub yourself.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*.exe
          fail_on_unmatched_files: true
